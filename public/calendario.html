<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario de Riego - Orquídea Smart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>📅 Calendario de Riego</h1>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="historial.html">Historial</a>
    </nav>
  </header>

  <main>
    <section class="panel">
      <h2>Programar un nuevo riego</h2>
      <p>Selecciona la fecha, hora y método de notificación.</p>

      <form id="formRiego">
        <label for="fecha">Fecha de riego:</label>
        <input type="date" id="fecha" required>

        <label for="hora">Hora de riego:</label>
        <input type="time" id="hora" required>

        <label for="correo">Correo (opcional):</label>
        <input type="email" id="correo" placeholder="ejemplo@correo.com">

        <label for="telefono">Teléfono (opcional):</label>
        <input type="tel" id="telefono" placeholder="+569XXXXXXXX">

        <button type="submit">💧 Guardar riego</button>
      </form>

      <div id="listaRiegos">
        <h3>Riegos Programados</h3>
        <p>No hay riegos registrados aún.</p>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2025 Orquídea Smart | Proyecto Integración de Competencias II</p>
  </footer>

  <script src="js/observer.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
