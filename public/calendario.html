<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario de Riego - Orquídea Smart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>📅 Calendario de Riego</h1>
  <nav><a href="index.html">Volver</a></nav>
</header>

<main>
  <section class="panel">
    <h2>Programar Riego</h2>
    <form id="formRiego">
      <label>Fecha:</label>
      <input type="date" id="fecha" required>
      <label>Hora:</label>
      <input type="time" id="hora" required>
      <label>Correo (opcional):</label>
      <input type="email" id="correo" placeholder="correo@ejemplo.com">
      <label>Teléfono (opcional, formato internacional):</label>
      <input type="tel" id="telefono" placeholder="+569XXXXXXXX">
      <button type="submit">Guardar</button>
    </form>
    <div id="listaRiegos"></div>
  </section>
</main>

<script src="js/observer.js"></script>
<script src="js/main.js"></script>
</body>
</html>
